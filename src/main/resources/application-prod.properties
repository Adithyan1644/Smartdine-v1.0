# =====================================================================
# SmartDine — GCP App Engine Production Configuration
# =====================================================================
# Active profile: prod  (--spring.profiles.active=prod via app.yaml)
# DataSourceConfig.java (@Profile("prod")) creates DUAL HikariCP pools
# explicitly with Cloud SQL Socket Factory URLs — no proxy needed.
#
# Routing (per request):
#   isTest=true  → SmartDine-DEV-Pool  → smartdine_dev (sandbox)
#   isTest=false → SmartDine-PROD-Pool → smartdine     (production)
# =====================================================================

spring.application.name=smartdine-heart-cloud

# ── CRITICAL: Disable DataSource auto-configuration on App Engine ─────────────
# DataSourceConfig.java (@Profile("prod")) provides a @Primary RoutingDataSource
# that wires TWO HikariCP pools (SmartDine-DEV-Pool and SmartDine-PROD-Pool).
# Without this exclusion, Spring Boot auto-configures its own HikariPool-1 from
# spring.datasource.url BEFORE DataSourceConfig registers its @Primary bean,
# causing the routing datasource to be ignored entirely.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ── SAFETY NET Datasource ─────────────────────────────────────────────────────
# Used by Spring Boot auto-configuration ONLY if DataSourceConfig.java fails
# to initialize its @Primary RoutingDataSource bean.
# Under normal operation, DataSourceConfig overrides this with two pools.
spring.datasource.url=jdbc:postgresql:///smartdine_dev?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=smartdine-saas:asia-south1:smartdine-db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate — Production Settings ────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Logging — Production ──────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.smartdine=INFO
# Show DataSourceConfig startup messages to confirm both pools initialized
logging.level.com.zaxxer.hikari=INFO
