# Google Cloud Platform Production Configuration
spring.application.name=smartdine-heart-cloud

# Cloud SQL PostgreSQL connection settings using Google Socket Factory
spring.datasource.url=jdbc:postgresql:///smartdine?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=smartdine-saas:asia-south1:smartdine-db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging properties
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
