# ===============================================================
# SMARTDINE CORE-HEART CONFIGURATION (LOCAL HUB)
# ===============================================================

# 1. JAVA 21 VIRTUAL THREADS (The Superpower)
# This allows the Billing PC to handle 10,000+ concurrent requests 
# (Waiters, KDS, Admin) with very low RAM usage.
spring.threads.virtual.enabled=true

# 2. SERVER CONFIGURATION
# Standard port for local API & bound to 0.0.0.0 for LAN/Wi-Fi devices
server.port=${PORT:8080}
server.address=0.0.0.0
# Set a custom name for your app
spring.application.name=SmartDine-Heart

# 3. POSTGRESQL DATABASE CONNECTION (LOCAL — Offline-First POS)
# -----------------------------------------------------------------------
# This is the PRIMARY datasource for all POS operations:
#   Billing, Orders, KDS, Menu, Tables, Waiters — fully offline-capable.
# The local Spring Boot reads/writes here even without internet.
# GCP Cloud SQL is only activated on App Engine (application-prod.properties).
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdine_dev
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# OPTIONAL: GCP Cloud SQL via Cloud SQL Auth Proxy (only needed for local
# cloud-registration testing — not required for normal POS operation).
# To enable: run   cloud-sql-proxy smartdine-saas:asia-south1:smartdine-db --port 5433
# The DataSourceConfig bean is @Profile("prod") so it is INACTIVE locally.
# app.datasource.dev.jdbc-url=jdbc:postgresql://127.0.0.1:5433/smartdine_dev
# app.datasource.prod.jdbc-url=jdbc:postgresql://127.0.0.1:5433/smartdine

# 4. JPA / HIBERNATE SETTINGS
# 'update' automatically builds/modifies tables based on your Java Entities.
spring.jpa.hibernate.ddl-auto=update
# Explicitly set the Postgres Dialect so Hibernate can boot instantly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Show SQL in console (Very helpful for debugging during development)
spring.jpa.show-sql=true
# Formats the SQL to be readable in the console
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 5. SECURITY & JWT (The Shield)
# Change 'smartdine-secret-key' to a long random string for production
smartdine.jwt.secret=your-ultra-long-secret-key-for-security-purposes-only-12345
# Token valid for 12 hours (Shift duration)
smartdine.jwt.expiration=315360000000

# 6. JSON & DATE FORMATTING
# Ensures Dates sent to Flutter/JavaFX look like "2023-10-27T10:00:00"
spring.jackson.serialization.write-dates-as-timestamps=false
# Ignore null values to keep JSON response clean
spring.jackson.default-property-inclusion=non_null

# 7. LOGGING CONFIGURATION
# Professional logging to track errors and orders
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.smartdine=DEBUG

# 8. FILE UPLOADS (For Menu Images)
# Limit size of food photos to 2MB to keep the Local Hub fast
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# 9. WEBSOCKET SETTINGS
# Ensure WebSockets can handle the fast-paced restaurant traffic
spring.main.allow-bean-definition-overriding=true